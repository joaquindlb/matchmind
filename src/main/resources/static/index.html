<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MatchMind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
          --bg: #FFFFFF;
          --card: #F2F4F3;
          --ink: #1C1F1E;
          --muted: #5E6763;
          --line: #E1E5E3;
          --pitch: #1E6B47;
          --pitch-dark: #144A31;
          --away: #2C3E8C;
          --draw: #CFC6AE;
          --accent-a: #1E8A5A;
          --accent-b: #2C5FB8;
          --error: #B3261E;
          --font: "Plus Jakarta Sans", "Segoe UI", Arial, sans-serif;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; }
        button, select { font: inherit; color: inherit; }
        :focus-visible { outline: 3px solid var(--accent-b); outline-offset: 2px; }

        .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }

        /* Sidebar */
        aside { padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
        .logo { display: flex; align-items: center; gap: 10px; padding: 4px 8px 24px; }
        .logo-mark {
          width: 44px; height: 44px; border-radius: 10px; background: var(--pitch);
          color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 15px; line-height: 1.05; text-align: center;
        }
        .logo-name { font-weight: 800; font-size: 20px; }
        .side-title { font-size: 13px; color: var(--muted); padding: 0 12px 8px; }
        .league {
          display: flex; align-items: center; gap: 12px; width: 100%;
          padding: 11px 12px; border: 0; border-radius: 16px; background: transparent;
          font-weight: 700; font-size: 15px; text-align: left; cursor: pointer;
        }
        .league:hover { background: var(--card); }
        .league[aria-current="true"] { background: #E3EFE8; color: var(--pitch-dark); }
        .badge {
          width: 28px; height: 28px; border-radius: 50%; background: var(--card); border: 1px solid var(--line);
          display: grid; place-items: center; font-size: 11px; font-weight: 800; color: var(--muted); flex: none;
        }
        .league[aria-current="true"] .badge { background: var(--pitch); color: #fff; border-color: var(--pitch); }
        .side-note { margin: 24px 12px 0; font-size: 13px; color: var(--muted); }

        /* Top bar */
        .main { padding: 20px 28px 48px; min-width: 0; }
        .topbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .pill-dark {
          position: relative; display: flex; align-items: center; background: var(--ink); color: #fff;
          border-radius: 999px; padding: 4px; box-shadow: 0 0 0 4px #fff, 0 0 0 5px var(--line);
        }
        .pill-dark select {
          appearance: none; background: transparent; border: 0; color: #fff; font-weight: 700;
          padding: 10px 40px 10px 18px; cursor: pointer; border-radius: 999px;
        }
        .pill-dark select option { color: var(--ink); }
        .pill-dark::after { content: ""; position: absolute; right: 20px; width: 7px; height: 7px; border-right: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(45deg) translateY(-3px); pointer-events: none; }

        .pill-bar {
          flex: 1; min-width: 280px; display: flex; align-items: center; gap: 6px;
          background: #fff; border-radius: 999px; padding: 6px; box-shadow: 0 0 0 1px var(--line), 0 2px 10px rgba(28,31,30,.06);
        }
        .team-pick { flex: 1; position: relative; }
        .team-pick label { position: absolute; left: 20px; top: 7px; font-size: 11px; color: var(--muted); pointer-events: none; }
        .team-pick select {
          width: 100%; appearance: none; border: 0; background: var(--card); border-radius: 999px;
          padding: 20px 36px 6px 20px; font-weight: 700; cursor: pointer;
        }
        .team-pick::after { content: ""; position: absolute; right: 18px; top: 50%; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
        .vs { font-weight: 800; color: var(--muted); padding: 0 6px; }

        .predict {
          border: 0; border-radius: 999px; padding: 15px 26px; font-weight: 800; color: #fff; cursor: pointer;
          background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
          box-shadow: 0 0 0 4px #fff, 0 0 0 5px var(--line);
        }
        .predict:disabled { opacity: .65; cursor: wait; }

        /* Content */
        .content { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; margin-top: 28px; }
        .wide { grid-column: 1 / -1; }
        h1 { font-size: 34px; font-weight: 800; line-height: 1.15; margin: 0; letter-spacing: -.01em; }
        .subtitle { margin: 6px 0 0; color: var(--muted); }
        .message { margin: 16px 0 0; color: var(--muted); }
        .message.error { color: var(--error); }

        .card { background: var(--card); border-radius: 24px; padding: 24px; }
        .card h2 { font-size: 20px; font-weight: 800; margin: 0 0 14px; }

        .alert {
          background: var(--ink); color: #fff; border-radius: 20px; padding: 18px 24px;
          display: flex; align-items: center; justify-content: space-between; gap: 16px;
        }
        .alert strong { display: block; font-size: 18px; }
        .alert span { color: #C9D2CD; }
        .alert .big { font-size: 34px; font-weight: 800; color: #fff; white-space: nowrap; }

        .fixture { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
        .team-head { display: flex; align-items: center; gap: 14px; min-width: 0; }
        .team-head.away-side { flex-direction: row-reverse; }
        .crest { width: 60px; height: 60px; object-fit: contain; flex: none; }
        .crest[hidden] { display: none; }
        .alert-main { display: flex; align-items: center; gap: 14px; }
        .alert-crest { width: 44px; height: 44px; object-fit: contain; background: #fff; border-radius: 50%; padding: 6px; flex: none; }
        .team-name { font-size: 28px; font-weight: 800; line-height: 1.1; }
        .team-name.home { color: var(--pitch); }
        .team-name.away { color: var(--away); text-align: right; }
        .xg { font-size: 14px; color: var(--muted); margin-top: 4px; }
        .away-side .xg { text-align: right; }
        .kick { font-weight: 800; color: var(--muted); padding-bottom: 4px; }

        .pitch { position: relative; display: flex; height: 92px; margin-top: 20px; border-radius: 18px; overflow: hidden; }
        .pitch::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 2px solid rgba(255,255,255,.4); pointer-events: none; }
        .pitch::after { content: ""; position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.4); border-radius: 50%; pointer-events: none; }
        .zone { display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; min-width: 0; transition: width .6s ease; }
        .zone.home { background: var(--pitch); color: #fff; }
        .zone.draw { background: var(--draw); color: var(--ink); }
        .zone.away { background: var(--away); color: #fff; }
        .legend { display: flex; margin-top: 8px; font-size: 13px; color: var(--muted); }
        .legend span { text-align: center; white-space: nowrap; min-width: 0; transition: width .6s ease; }

        .analysis { font-size: 17px; line-height: 1.7; margin: 0; max-width: 68ch; }
        .analysis.pending { color: var(--muted); }
        .analysis.error { color: var(--error); font-size: 15px; }

        .scores { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
        .score { display: flex; align-items: center; justify-content: space-between; background: #fff; border-radius: 14px; padding: 12px 16px; }
        .score b { font-size: 22px; font-weight: 800; }
        .score small { color: var(--muted); font-weight: 700; }
        .score:first-child { background: var(--pitch); color: #fff; }
        .score:first-child small { color: #CFE6DA; }

        .footnote { font-size: 13px; color: var(--muted); margin: 0; }
        .empty { text-align: center; padding: 56px 24px; }
        .empty h2 { margin-bottom: 6px; }
        .empty p { margin: 0; color: var(--muted); }
        #result { display: none; }

        @media (max-width: 1100px) {
          .content { grid-template-columns: 1fr; }
        }
        @media (max-width: 860px) {
          .app { grid-template-columns: 1fr; }
          aside { position: static; height: auto; padding-bottom: 0; }
          .side-title, .side-note { display: none; }
          .leagues { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; }
          .league { width: auto; white-space: nowrap; }
          .logo { padding-bottom: 12px; }
          .main { padding: 12px 16px 40px; }
          .pill-bar { min-width: 0; width: 100%; flex-basis: 100%; }
          .predict { width: 100%; }
          h1 { font-size: 26px; }
          .team-name { font-size: 22px; }
          .crest { width: 40px; height: 40px; }
          .zone { font-size: 20px; }
          .alert { flex-direction: column; align-items: flex-start; }
        }
        @media (prefers-reduced-motion: reduce) { .zone, .legend span { transition: none; } }
    </style>
</head>
<body>
<div class="app">
    <aside>
        <div class="logo">
            <div class="logo-mark" aria-hidden="true">MM</div>
            <span class="logo-name">MatchMind</span>
        </div>
        <div class="side-title">Leagues</div>
        <nav class="leagues" id="leagues" aria-label="Leagues"></nav>
        <p class="side-note">Forecasts use every finished match of the current season.</p>
    </aside>

    <div class="main">
        <div class="topbar">
            <div class="pill-dark">
                <label for="competition" class="sr-only" style="position:absolute;left:-9999px">League</label>
                <select id="competition"></select>
            </div>
            <div class="pill-bar">
                <div class="team-pick">
                    <label for="home">Home team</label>
                    <select id="home"></select>
                </div>
                <span class="vs">vs</span>
                <div class="team-pick">
                    <label for="away">Away team</label>
                    <select id="away"></select>
                </div>
            </div>
            <button class="predict" id="predict">⚡ Predict match</button>
        </div>

        <p id="message" class="message" role="status"></p>

        <section id="empty" class="card empty" style="margin-top:28px">
            <h2>Pick a matchup</h2>
            <p>Choose a league on the left, then two teams, and press Predict match.</p>
        </section>

        <section id="result" class="content" aria-live="polite">
            <div class="wide">
                <h1 id="title"></h1>
                <p class="subtitle" id="subtitle"></p>
            </div>

            <div class="alert wide">
                <div class="alert-main">
                    <img id="alert-crest" class="alert-crest" alt="" hidden>
                    <div>
                        <strong id="alert-title"></strong>
                        <span id="alert-text"></span>
                    </div>
                </div>
                <div class="big" id="alert-pct"></div>
            </div>

            <div class="card wide">
                <div class="fixture">
                    <div class="team-head">
                        <img id="r-home-crest" class="crest" alt="" hidden>
                        <div>
                            <div class="team-name home" id="r-home"></div>
                            <div class="xg" id="r-home-xg"></div>
                        </div>
                    </div>
                    <span class="kick">vs</span>
                    <div class="team-head away-side">
                        <img id="r-away-crest" class="crest" alt="" hidden>
                        <div>
                            <div class="team-name away" id="r-away"></div>
                            <div class="xg" id="r-away-xg"></div>
                        </div>
                    </div>
                </div>
                <div class="pitch" aria-label="Win, draw and loss probabilities">
                    <div class="zone home" id="z-home"></div>
                    <div class="zone draw" id="z-draw"></div>
                    <div class="zone away" id="z-away"></div>
                </div>
                <div class="legend"><span id="l-home">Home win</span><span id="l-draw">Draw</span><span id="l-away">Away win</span></div>
            </div>

            <div class="card">
                <h2>Match analysis</h2>
                <p class="analysis" id="analysis"></p>
            </div>

            <div class="card">
                <h2>Most likely scores</h2>
                <ol class="scores" id="scores"></ol>
            </div>

            <p class="footnote wide" id="footnote"></p>
        </section>
    </div>
</div>

<script>
    const LEAGUES = [
      ["PL", "Premier League", "EN"],
      ["PD", "La Liga", "ES"],
      ["SA", "Serie A", "IT"],
      ["BL1", "Bundesliga", "DE"],
      ["FL1", "Ligue 1", "FR"],
      ["DED", "Eredivisie", "NL"],
      ["PPL", "Primeira Liga", "PT"],
      ["ELC", "Championship", "EN"],
      ["BSA", "Brasileirão", "BR"]
    ];
    const $ = id => document.getElementById(id);
    const crests = {};  // team id -> crest image URL, filled when a league's teams load

    // Shows a crest if we have one; hides the image if it is missing or fails to load
    function setCrest(img, teamId, teamName) {
      const url = crests[teamId];
      img.onerror = () => { img.hidden = true; };
      if (url) {
        img.src = url;
        img.alt = teamName + " crest";
        img.hidden = false;
      } else {
        img.hidden = true;
      }
    }

    const leagueName = code => (LEAGUES.find(l => l[0] === code) || [code, code])[1];

    // Build the sidebar and the league dropdown from the same list
    for (const [code, name, badge] of LEAGUES) {
      const btn = document.createElement("button");
      btn.className = "league";
      btn.dataset.code = code;
      btn.innerHTML = `<span class="badge">${badge}</span>${name}`;
      btn.addEventListener("click", () => selectLeague(code));
      $("leagues").appendChild(btn);
      $("competition").add(new Option(name, code));
    }

    function selectLeague(code) {
      $("competition").value = code;
      document.querySelectorAll(".league").forEach(b =>
        b.setAttribute("aria-current", b.dataset.code === code ? "true" : "false"));
      loadTeams();
    }

    function showMessage(text, isError = false) {
      $("message").textContent = text;
      $("message").className = "message" + (isError ? " error" : "");
    }

    async function getJson(url) {
      const res = await fetch(url);
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || "The server returned an error (" + res.status + "). Check the IntelliJ console.");
      return body;
    }

    async function loadTeams() {
      const code = $("competition").value;
      showMessage("Loading teams…");
      $("home").innerHTML = "";
      $("away").innerHTML = "";
      try {
        const teams = await getJson("/api/competitions/" + code + "/teams");
        teams.sort((a, b) => a.shortName.localeCompare(b.shortName));
        for (const t of teams) {
          crests[t.id] = t.crest;
          $("home").add(new Option(t.shortName, t.id));
          $("away").add(new Option(t.shortName, t.id));
        }
        if (teams.length > 1) $("away").selectedIndex = 1;
        showMessage("");
      } catch (e) {
        showMessage("Could not load teams. " + e.message + " If you switched leagues quickly, wait a minute: the free data plan allows 10 requests per minute.", true);
      }
    }

    async function predict() {
      const home = $("home").value, away = $("away").value;
      if (!home || !away) return showMessage("Choose two teams first.", true);
      if (home === away) return showMessage("Choose two different teams.", true);

      $("predict").disabled = true;
      showMessage("Crunching the numbers…");
      try {
        const p = await getJson(`/api/predict?competition=${$("competition").value}&home=${home}&away=${away}`);
        render(p, home, away);
        showMessage("");
        loadAnalysis(home, away);
      } catch (e) {
        showMessage(e.message, true);
      } finally {
        $("predict").disabled = false;
      }
    }

    let analysisRequest = 0;

    async function loadAnalysis(home, away) {
      const requestId = ++analysisRequest;
      const box = $("analysis");
      box.className = "analysis pending";
      box.textContent = "Writing the analysis…";
      try {
        const r = await getJson(`/api/analysis?competition=${$("competition").value}&home=${home}&away=${away}`);
        if (requestId !== analysisRequest) return;
        box.className = "analysis";
        box.textContent = r.analysis;
      } catch (e) {
        if (requestId !== analysisRequest) return;
        box.className = "analysis error";
        box.textContent = e.message;
      }
    }

    function render(p, homeId, awayId) {
      $("empty").style.display = "none";
      $("result").style.display = "grid";

      $("title").textContent = `${p.homeTeam} vs ${p.awayTeam}`;
      $("subtitle").textContent = `${leagueName(p.competition)}, forecast from ${p.matchesAnalyzed} finished matches this season`;

      // Headline card: who the model favors
      const outcomes = [
        [p.homeWinPercent, `${p.homeTeam} are the favorites`, "Chance of a home win", homeId, p.homeTeam],
        [p.drawPercent, "A draw is the most likely outcome", "Chance of a draw", null, null],
        [p.awayWinPercent, `${p.awayTeam} are the favorites`, "Chance of an away win", awayId, p.awayTeam]
      ].sort((a, b) => b[0] - a[0]);
      const [bestPct, bestTitle, bestText, favoriteId, favoriteName] = outcomes[0];
      const close = bestPct - outcomes[1][0] < 8;
      if (!close && favoriteId) setCrest($("alert-crest"), favoriteId, favoriteName);
      else $("alert-crest").hidden = true;
      $("alert-title").textContent = close ? "Too close to call" : bestTitle;
      $("alert-text").textContent = close ? "The top two outcomes are within a few points of each other" : bestText;
      $("alert-pct").textContent = Math.round(bestPct) + "%";

      $("r-home").textContent = p.homeTeam;
      $("r-away").textContent = p.awayTeam;
      setCrest($("r-home-crest"), homeId, p.homeTeam);
      setCrest($("r-away-crest"), awayId, p.awayTeam);
      $("r-home-xg").textContent = "Expected goals " + p.expectedHomeGoals.toFixed(2);
      $("r-away-xg").textContent = "Expected goals " + p.expectedAwayGoals.toFixed(2);

      for (const [key, pct] of [["home", p.homeWinPercent], ["draw", p.drawPercent], ["away", p.awayWinPercent]]) {
        $("z-" + key).style.width = pct + "%";
        $("z-" + key).textContent = pct >= 8 ? Math.round(pct) + "%" : "";
        $("l-" + key).style.width = pct + "%";
      }

      $("scores").innerHTML = p.mostLikelyScores.map(s =>
        `<li class="score"><b>${s.homeGoals}–${s.awayGoals}</b><small>${s.percent}%</small></li>`
      ).join("");

      $("footnote").textContent =
        "Probabilities come from a Poisson model of each team's attack and defense strength compared with the league average. The written analysis is generated by Gemini from these numbers only.";
    }

    $("competition").addEventListener("change", () => selectLeague($("competition").value));
    $("predict").addEventListener("click", predict);
    selectLeague("PL");
</script>
</body>
</html>
